# media-stack — env-driven compose. All values come from .env (generated by install.sh).
# Core services have no profile and always run; the optional ones are gated by Compose profiles
# (COMPOSE_PROFILES in .env): notify = ntfy. Tailscale and GPU passthrough are added by the
# generated docker-compose.override.yml when you opt in.
#
# The control panel is Controllarr (https://github.com/lochlannfoster/controllarr): install.sh
# clones it at a pinned version into ./controllarr and this file runs that code.
name: ${STACK_NAME:-mediastack}

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

x-dns: &dns
  dns:
    - 1.1.1.1
    - 9.9.9.9

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    labels: [autoheal=true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    <<: *dns
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    labels: [autoheal=true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5055/api/v1/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *dns
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
      # panel-set quiet hours / topics for the notify hook (read-only; the file is created by the installer)
      - ${CONFIG_DIR}/controllarr/settings.local:/config/controllarr/settings.local:ro
    ports:
      - "${RADARR_PORT:-7878}:7878"
    labels: [autoheal=true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *dns
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
      - ${CONFIG_DIR}/controllarr/settings.local:/config/controllarr/settings.local:ro
    ports:
      - "${SONARR_PORT:-8989}:8989"
    labels: [autoheal=true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    <<: *dns
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/api/system/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels: [autoheal=true]
    restart: unless-stopped

  # Controllarr — the control panel, from its own repository (install.sh clones it into ./controllarr
  # at a pinned version). It reads every app over its API and writes only its own directory.
  controllarr:
    image: python:3.12-alpine
    container_name: controllarr
    environment:
      TZ: ${TZ:-Etc/UTC}
      CONTROLLARR_ENV: ${CONFIG_DIR}/controllarr/controllarr.env
      CONTROLLARR_DIR: ${CONFIG_DIR}/controllarr
      CONTROLLARR_PORT: "3002"   # fixed inside the container; CONTROLLARR_PORT in .env moves the HOST port
      CONTROLLARR_REFRESH: "${CONTROLLARR_REFRESH:-15}"
    volumes:
      - ./controllarr/app:/app:ro                       # the panel's code, pinned, read-only
      - ${CONFIG_DIR}:${CONFIG_DIR}:ro                  # reads every app's API key
      - ${CONFIG_DIR}/controllarr:${CONFIG_DIR}/controllarr:rw   # its own state: the one thing it writes
      - ${DATA_DIR}:${DATA_DIR}:ro                      # free space on the media volume
      - ${BACKUP_DIR:-/srv/media/backups}:${BACKUP_DIR:-/srv/media/backups}:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro    # container state, memory and last log lines
    command: python3 /app/controllarr.py
    ports:
      - "${CONTROLLARR_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3002/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels: [autoheal=true]
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      TZ: ${TZ:-Etc/UTC}
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ---------- optional (profiles) ----------
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    profiles: ["notify"]
    command: serve
    environment:
      NTFY_BASE_URL: http://${SERVER_HOST}:${NTFY_PORT:-8090}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "false"
      NTFY_AUTH_DEFAULT_ACCESS: read-write
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 48h
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_DIR}/ntfy:/var/cache/ntfy
    ports:
      - "${NTFY_PORT:-8090}:80"
    restart: unless-stopped
